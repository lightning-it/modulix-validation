# yamllint disable rule:truthy
---
name: Collection infrastructure quality profile

on:
  workflow_call:
    inputs:
      profile:
        description: Heavy or Application Acceptance profile to execute.
        required: true
        type: string
      matrix-json:
        description: Compact include matrix generated by the calling collection.
        required: true
        type: string
      candidate-artifact:
        description: Exact collection candidate artifact from the caller run.
        required: true
        type: string
      source-sha:
        description: Exact collection commit represented by the candidate.
        required: true
        type: string
      environment-name:
        description: Protected GitHub Environment containing runtime policy and secrets.
        required: true
        type: string
      cpu-limit:
        description: Per-cell Incus CPU limit.
        required: false
        default: "4"
        type: string
      memory-limit:
        description: Per-cell Incus memory limit.
        required: false
        default: 8GiB
        type: string
      disk-limit:
        description: Per-cell Incus root disk limit.
        required: false
        default: 24GiB
        type: string

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate delegated profile contract
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.contract.outputs.profile }}
    steps:
      - id: contract
        name: Validate profile and exact candidate identity
        env:
          PROFILE: ${{ inputs.profile }}
          MATRIX_JSON: ${{ inputs['matrix-json'] }}
          SOURCE_SHA: ${{ inputs['source-sha'] }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            heavy|application_acceptance) ;;
            *) echo "unsupported delegated profile: $PROFILE" >&2; exit 1 ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 -c 'import json,sys; value=json.loads(sys.argv[1]); assert isinstance(value, dict); assert isinstance(value.get("include"), list); assert value["include"]' "$MATRIX_JSON"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

  profile-cells:
    name: ${{ inputs.profile }} / ${{ matrix.scenario }} / ${{ matrix.target }}
    needs: validate-inputs
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(inputs['matrix-json']) }}
    runs-on: ${{ matrix.runner }}
    environment:
      name: ${{ inputs['environment-name'] }}
    timeout-minutes: 180
    concurrency:
      group: >-
        validation-${{ github.repository }}-${{ inputs.profile }}-${{ github.run_id }}-${{
        github.run_attempt }}-${{ matrix.component }}-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact collection source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: ${{ inputs['source-sha'] }}
          persist-credentials: false
      - name: Checkout exact validation harness
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          repository: lightning-it/modulix-validation-lit
          ref: ${{ github.workflow_sha }}
          path: .validation-harness
          persist-credentials: false
      - name: Run validation-owned infrastructure profile
        uses: ./.validation-harness/.github/actions/run-quality-profile
        with:
          profile: ${{ needs.validate-inputs.outputs.profile }}
          scenario: ${{ matrix.scenario }}
          target: ${{ matrix.target }}
          target-disposition: ${{ matrix.target_disposition || 'supported' }}
          roles: ${{ join(matrix.roles, ',') }}
          image: ${{ matrix.image || vars[matrix.image_variable] }}
          instance-type: ${{ matrix.instance_type }}
          candidate-artifact: ${{ inputs['candidate-artifact'] }}
          source-sha: ${{ inputs['source-sha'] }}
          junit-required: ${{ matrix.junit }}
          allure-required: ${{ matrix.allure }}
          cpu-limit: ${{ inputs['cpu-limit'] }}
          memory-limit: ${{ inputs['memory-limit'] }}
          disk-limit: ${{ inputs['disk-limit'] }}
