# yamllint disable rule:line-length
# yamllint disable rule:truthy
---
name: Collection infrastructure quality profile

on:
  workflow_call:
    inputs:
      profile:
        description: Heavy or Application Acceptance profile to execute.
        required: true
        type: string
      matrix-json:
        description: Compact include matrix generated by the calling collection.
        required: true
        type: string
      candidate-artifact:
        description: Exact collection candidate artifact from the caller run.
        required: true
        type: string
      source-sha:
        description: Exact collection commit represented by the candidate.
        required: true
        type: string
      source-repository:
        description: Repository that contains the exact collection source.
        required: false
        default: ""
        type: string
      source-token-mode:
        description: Token source for an explicitly cross-repository checkout.
        required: false
        default: legacy
        type: string
      environment-name:
        description: Protected GitHub Environment containing runtime policy and secrets.
        required: true
        type: string
      cpu-limit:
        description: Per-cell Incus CPU limit.
        required: false
        default: "4"
        type: string
      memory-limit:
        description: Per-cell Incus memory limit.
        required: false
        default: 12GiB
        type: string
      disk-limit:
        description: Per-cell Incus root disk limit.
        required: false
        default: 24GiB
        type: string
    secrets:
      LIT_REPOSITORY_READ_TOKEN:
        required: false
      RELEASE_AUTOMATION_APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  validate-inputs:
    name: Validate delegated profile contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.contract.outputs.profile }}
    steps:
      - id: contract
        name: Validate profile and exact candidate identity
        env:
          PROFILE: ${{ inputs.profile }}
          MATRIX_JSON: ${{ inputs['matrix-json'] }}
          CALLER_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ inputs['source-repository'] || github.repository }}
          SOURCE_TOKEN_MODE: ${{ inputs['source-token-mode'] }}
          SOURCE_SHA: ${{ inputs['source-sha'] }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            heavy|application_acceptance) ;;
            *) echo "unsupported delegated profile: $PROFILE" >&2; exit 1 ;;
          esac
          [[ "$CALLER_REPOSITORY" =~ ^lightning-it/[A-Za-z0-9_.-]+$ ]] || {
            echo "workflow caller is not allowlisted" >&2
            exit 1
          }
          [[ "$SOURCE_REPOSITORY" =~ ^lightning-it/[A-Za-z0-9_.-]+$ ]] || {
            echo "source-repository is not allowlisted" >&2
            exit 1
          }
          case "$SOURCE_TOKEN_MODE" in
            legacy) ;;
            release-automation-app)
              test "$SOURCE_REPOSITORY" = "lightning-it/ansible-collection-supplementary"
              ;;
            *) echo "unsupported source-token-mode" >&2; exit 1 ;;
          esac
          if [[ ! "$SOURCE_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "source-sha must be an exact 40- or 64-character lowercase hexadecimal commit ID" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os

          value = json.loads(os.environ["MATRIX_JSON"])
          cells = value.get("include") if isinstance(value, dict) else None
          if not isinstance(cells, list) or not cells:
              raise SystemExit("matrix-json must contain a non-empty include list")
          required = {
              "allure",
              "component",
              "instance_type",
              "junit",
              "roles",
              "runner",
              "scenario",
              "target",
          }
          for index, cell in enumerate(cells):
              if not isinstance(cell, dict):
                  raise SystemExit(f"matrix-json include[{index}] must be an object")
              missing = sorted(required - cell.keys())
              if missing:
                  raise SystemExit(f"matrix-json include[{index}] is missing: {', '.join(missing)}")
              if not isinstance(cell["runner"], (str, list)) or not cell["runner"]:
                  raise SystemExit(f"matrix-json include[{index}].runner must be non-empty")
              if not isinstance(cell["roles"], list) or not cell["roles"]:
                  raise SystemExit(f"matrix-json include[{index}].roles must be a non-empty list")
              for key in ("component", "scenario", "target", "instance_type"):
                  if not isinstance(cell[key], str) or not cell[key]:
                      raise SystemExit(f"matrix-json include[{index}].{key} must be a non-empty string")
              for key in ("junit", "allure"):
                  if not isinstance(cell[key], bool):
                      raise SystemExit(f"matrix-json include[{index}].{key} must be a boolean")
          PY
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

  profile-cells:
    name: ${{ inputs.profile }} / ${{ matrix.scenario }} / ${{ matrix.target }}
    needs: validate-inputs
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(inputs['matrix-json']) }}
    runs-on: ${{ matrix.runner }}
    environment:
      name: ${{ inputs['environment-name'] }}
    timeout-minutes: 180
    concurrency:
      # A shared group can retain only one pending job; later collection
      # requests otherwise cancel an already queued required profile. Runner
      # capacity still serializes jobs that target the same physical worker.
      group: >-
        modulix-validation-incus-${{ github.repository_id }}-${{ github.run_id }}-${{
        github.run_attempt }}-${{ inputs.profile }}-${{ matrix.scenario }}-${{
        matrix.target }}
      cancel-in-progress: false
    steps:
      - name: Require release App credentials before cross-repository checkout
        if: inputs['source-token-mode'] == 'release-automation-app'
        env:
          APP_CLIENT_ID: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$APP_CLIENT_ID"
          test -n "$APP_PRIVATE_KEY"

      - name: Mint exact read-only Golden Path source token
        id: source-app
        if: inputs['source-token-mode'] == 'release-automation-app'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ansible-collection-supplementary
          permission-contents: read

      - name: Require exact App identity and one-repository token scope
        if: inputs['source-token-mode'] == 'release-automation-app'
        env:
          APP_INSTALLATION_ID: ${{ steps.source-app.outputs.installation-id }}
          APP_SLUG: ${{ steps.source-app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.source-app.outputs.token }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = "lightning-it-release-automation"
          test "$APP_INSTALLATION_ID" = "148019054"
          repositories="$(
            gh api --paginate 'installation/repositories?per_page=100' \
              | jq -sc '[.[].repositories[].full_name] | sort | unique'
          )"
          test "$repositories" = '["lightning-it/ansible-collection-supplementary"]'

      - name: Checkout exact collection source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ inputs['source-repository'] || github.repository }}
          ref: ${{ inputs['source-sha'] }}
          token: >-
            ${{ inputs['source-token-mode'] == 'release-automation-app' &&
            steps.source-app.outputs.token ||
            secrets.LIT_REPOSITORY_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Set up exact Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Run validation-owned infrastructure profile
        uses: lightning-it/modulix-validation/.github/actions/run-quality-profile@7d9e9edb4eb8f6efbd025a8da74a78f2de2d2ed4
        with:
          profile: ${{ needs.validate-inputs.outputs.profile }}
          scenario: ${{ matrix.scenario }}
          target: ${{ matrix.target }}
          target-disposition: ${{ matrix.target_disposition || 'supported' }}
          roles: ${{ join(matrix.roles, ',') }}
          image: ${{ matrix.image || vars[matrix.image_variable] }}
          instance-type: ${{ matrix.instance_type }}
          candidate-artifact: ${{ inputs['candidate-artifact'] }}
          source-sha: ${{ inputs['source-sha'] }}
          junit-required: ${{ matrix.junit }}
          allure-required: ${{ matrix.allure }}
          cpu-limit: ${{ inputs['cpu-limit'] }}
          memory-limit: ${{ inputs['memory-limit'] }}
          disk-limit: ${{ inputs['disk-limit'] }}
