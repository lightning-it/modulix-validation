---
schema_version: 1
suite: lit-cloud-hetzner-object-storage
source_repository: lightning-it/ansible-collection-cloud
collection: lit.cloud
environment: lit-cloud-hetzner-object-storage-heavy
retention_days: 30
matrix:
  include:
    - runner: [self-hosted, linux, x64, hetzner-s3]
      scenario: hetzner-object-storage-heavy
      target: fsn1
      infrastructure: external
      roles: [hetzner_object_storage]
      success_marker: assertions/hetzner-object-storage-heavy.passed
      resource_contract:
        name_prefix: lit-cloud-heavy
        ownership_fields: [repository, run_id, run_attempt, candidate_sha, expires_at]
        isolated_bucket: true
        external_principal_projects: true
        object_lock_fixture_expiry_days: 31
      assertions:
        actions: [plan, audit, reconcile]
        bucket: [private, versioning, object_lock_at_creation, governance_retention, multipart_cleanup]
        principals: [admin, writer, reader, reviewer]
        negative:
          writer: [get_object, delete_object, put_bucket_policy]
          reader: [put_object, delete_object, put_bucket_policy, put_object_retention]
          reviewer: [get_object, put_object, delete_object, put_bucket_policy, put_object_retention]
          same_project: [regression_full_rights_not_least_privilege]
      evidence:
        formats: [junit, manifest, sha256sums]
        redact: [access_key, secret_key, authorization, object_body]
        candidate_bound: true
        cleanup_required: true
